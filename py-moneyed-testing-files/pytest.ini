[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    smoke: small set of basic checks, run first
    regression: full set of checks
    money: tests for the Money class
    currency: tests for the Currency class and lookup functions
    l10n: tests for format_money (formatting)
    csv: data-driven tests that read tests/data/*.csv
    boundary: boundary value analysis (BVA) tests
    negative: tests that expect an error
